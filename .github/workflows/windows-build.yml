# Windows build (cloud) — compile + link every plugin on MSVC without a local Windows machine.
#
# FIRST STAGE ONLY: this validates that the C++ actually builds and links on Windows and
# uploads the raw VST3 + Standalone artefacts. It deliberately does NOT yet:
#   * bundle samples        — samples.pak is paid content, gitignored, so the artefacts here
#                             are SILENT (they load, render UI, accept MIDI, but play nothing).
#   * build the installer   — packaging/windows/make_installers.ps1 needs Inno Setup + the pack.
#   * Authenticode-sign     — needs a code-signing cert (add as a secret later).
# Those become follow-up stages once the cert + a way to feed CI the sample packs are sorted.
#
# The sibling repos are public under github.com/benjamindehli. Their repo names DIFFER from
# the local folder names the root CMake add_subdirectory()s (no "-plugin" suffix, different
# casing), so each is cloned INTO the expected folder (see the repo->dest map below). The
# engine + converter repo names are assumed to match their folders — adjust if not.
# If any repo is private, give the clone step a PAT secret (the default GITHUB_TOKEN can't
# reach other repos). All 13 plugins must be present to configure.

name: Windows build

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    tags: [ 'win-*' ]       # or on a win-* tag (e.g. win-2.0.0)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout orchestration root
        uses: actions/checkout@v4

      - name: Fetch sibling repos (engine + converter + plugins)
        shell: bash
        run: |
          set -euo pipefail
          # "<github-repo> <dest-folder>" — dest must match the root CMake add_subdirectory().
          repos=(
            "dehli-musikk-sampler-engine dehli-musikk-sampler-engine"
            "ds-plugin-converter ds-plugin-converter"
            "Omni-84 omni-84-plugin"
            "MaskinTrommer maskintrommer-plugin"
            "MidnightWurli midnight-wurli-plugin"
            "ElektriskSalmesykkel elektrisk-salmesykkel-plugin"
            "4-track-glockenspiel 4-track-glockenspiel-plugin"
            "4-track-toy-piano 4-track-toy-piano-plugin"
            "4-track-music-box 4-track-music-box-plugin"
            "EDB-Orgel edb-orgel-plugin"
            "Strykebrett strykebrett-plugin"
            "VoltageControlledCassetteOrgan voltage-controlled-cassette-organ-plugin"
            "lo-fi-tape-piano lo-fi-tape-piano-plugin"
            "StyloPoly stylopoly-plugin"
            "SubC subc-plugin"
          )
          for pair in "${repos[@]}"; do
            set -- $pair
            echo "== cloning $1 -> $2 =="
            git clone --depth 1 "https://github.com/benjamindehli/$1.git" "$2"
          done

      - name: Configure (MSVC, x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build all products (Release)
        run: cmake --build build --config Release --parallel

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # VST3 bundles + Standalone .exe for every plugin, keeping the product-name layout.
          for d in *-plugin; do
            art="build/$d"
            [ -d "$art" ] || continue
            find "$art" -type d -name "*.vst3" -path "*/Release/VST3/*" -prune -exec cp -r {} out/ \; || true
            find "$art" -type f -name "*.exe"  -path "*/Release/Standalone/*"    -exec cp    {} out/ \; || true
          done
          ls -R out

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-plugins-unsigned-nosamples
          path: out/
          if-no-files-found: error

      # --- Installer tooling validation ------------------------------------------------
      # Build the Inno Setup installers to prove installer.iss + make_installers.ps1 work
      # on Windows. These installers are UNSIGNED (no cert, by choice → SmartScreen warns)
      # and SAMPLE-FREE (the pack isn't in CI, so #if FileExists(PackSrc) compiles the pack
      # section away → the installed plugin is silent). This validates the packaging
      # pipeline only; a shippable installer is built on a real machine with the samples
      # present (see packaging/PACKAGING.md).
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installers (unsigned, sample-free — tooling check)
        shell: pwsh
        env:
          ISCC: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
        run: ./packaging/windows/make_installers.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-unsigned-nosamples
          path: packaging/windows/build/*-Setup.exe
          if-no-files-found: error
